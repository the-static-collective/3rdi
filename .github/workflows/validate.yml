name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Run unit and contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Run deterministic hatch labs
        run: python3 skills/3rdi/scripts/run_labs.py --check

      - name: Compile the canonical historical cut
        run: >-
          python3 skills/3rdi/scripts/compile_projection.py
          specimens/temporal-coordinate-001.json
          --cut june-15
          --check
